<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760" height="364" role="img" aria-label="Three layers of a cross-tenant partner entry and where each is configured" font-family="Aptos, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="364" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2937">Three layers on one partner entry; each needs the one below</text>
  <text x="24" y="58" font-size="11.5" fill="#4b5563">What it is</text>
  <text x="516" y="58" font-size="11.5" fill="#4b5563">Where you set it</text>

  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <line x1="484" y1="104" x2="516" y2="104" stroke-dasharray="4 4"/>
    <line x1="484" y1="192" x2="516" y2="192" stroke-dasharray="4 4"/>
    <line x1="484" y1="280" x2="516" y2="280" stroke-dasharray="4 4"/>
    <path d="M254 160V138" marker-end="url(#arrow)"/>
    <path d="M254 248V226" marker-end="url(#arrow)"/>
  </g>

  <rect x="24" y="72" width="460" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="99" font-weight="600" fill="#1f2937">Layer 3 · M365 capabilities</text>
  <text x="40" y="119" font-size="11.5" fill="#4b5563">Free/Busy, MailTips, Calendar Sharing grants, per partner</text>

  <rect x="24" y="160" width="460" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="187" font-weight="600" fill="#1f2937">Layer 2 · M365 Collaboration trust</text>
  <text x="40" y="207" font-size="11.5" fill="#4b5563">m365CollaborationInbound switched on for the partner</text>

  <rect x="24" y="248" width="460" height="64" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="40" y="275" font-weight="600" fill="#1f2937">Layer 1 · Entra cross-tenant access (B2B)</text>
  <text x="40" y="295" font-size="11.5" fill="#4b5563">Partner entry keyed on Tenant ID; inbound trust = MFA only</text>

  <rect x="516" y="72" width="220" height="64" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="532" y="99" font-weight="600" fill="#1f2937">Microsoft Graph (beta)</text>
  <text x="532" y="119" font-size="11.5" fill="#4b5563">no portal UI yet</text>

  <rect x="516" y="160" width="220" height="64" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="532" y="187" font-weight="600" fill="#1f2937">Microsoft Graph (beta)</text>
  <text x="532" y="207" font-size="11.5" fill="#4b5563">no portal UI yet</text>

  <rect x="516" y="248" width="220" height="64" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="532" y="275" font-weight="600" fill="#1f2937">Entra admin center</text>
  <text x="532" y="295" font-size="11.5" fill="#4b5563">Identity → External Identities</text>

  <rect x="24" y="332" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="46" y="343" font-size="11.5" fill="#4b5563">New with this change: what carries Free/Busy, MailTips and calendar sharing</text>
</svg>
