<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Each tenant's inbound policy governs what its partner can read" font-family="Aptos, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="360" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2937">Each tenant decides what its partner can read</text>

  <rect x="24" y="56" width="292" height="240" rx="8" fill="none" stroke="#e5e7eb" stroke-width="1.25"/>
  <text x="40" y="80" font-weight="600" fill="#4b5563">Tenant A · Op-Co A</text>
  <rect x="444" y="56" width="292" height="240" rx="8" fill="none" stroke="#e5e7eb" stroke-width="1.25"/>
  <text x="460" y="80" font-weight="600" fill="#4b5563">Tenant B · Op-Co B</text>

  <rect x="48" y="96" width="244" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="119" text-anchor="middle" font-weight="600" fill="#1f2937">Inbound XTAP policy</text>
  <text x="170" y="136" text-anchor="middle" font-size="11.5" fill="#4b5563">partner: Tenant B · Layers 1 to 3</text>
  <rect x="468" y="96" width="244" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="590" y="119" text-anchor="middle" font-weight="600" fill="#1f2937">Inbound XTAP policy</text>
  <text x="590" y="136" text-anchor="middle" font-size="11.5" fill="#4b5563">partner: Tenant A · Layers 1 to 3</text>

  <rect x="48" y="218" width="244" height="52" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="170" y="241" text-anchor="middle" font-weight="600" fill="#1f2937">Mailboxes and calendars</text>
  <text x="170" y="258" text-anchor="middle" font-size="11.5" fill="#4b5563">Op-Co A users</text>
  <rect x="468" y="218" width="244" height="52" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="590" y="241" text-anchor="middle" font-weight="600" fill="#1f2937">Mailboxes and calendars</text>
  <text x="590" y="258" text-anchor="middle" font-size="11.5" fill="#4b5563">Op-Co B users</text>

  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <path d="M170 148V216" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <path d="M590 148V216" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <path d="M292 234H466" marker-end="url(#arrow)"/>
    <path d="M468 254H294" marker-end="url(#arrow)"/>
  </g>
  <text x="180" y="187" font-size="11.5" fill="#4b5563">sets what B can read</text>
  <text x="600" y="187" font-size="11.5" fill="#4b5563">sets what A can read</text>
  <text x="380" y="226" text-anchor="middle" font-size="11.5" fill="#4b5563">A's free/busy</text>
  <text x="380" y="272" text-anchor="middle" font-size="11.5" fill="#4b5563">B's free/busy</text>

  <text x="24" y="330" font-size="11.5" fill="#4b5563">Two-way sharing = two configurations, one per tenant. Levels can differ in each direction.</text>
</svg>
