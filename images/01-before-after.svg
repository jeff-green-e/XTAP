<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-label="Old versus new cross-tenant free/busy request path" font-family="Aptos, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="372" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2937">Same user experience, different plumbing</text>

  <text x="24" y="66" font-weight="600" fill="#4b5563">Before: EWS (retiring)</text>
  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <path d="M180 110H208" marker-end="url(#arrow)"/>
    <path d="M364 110H392" marker-end="url(#arrow)"/>
    <path d="M548 110H576" marker-end="url(#arrow)"/>
  </g>
  <rect x="24" y="84" width="156" height="52" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="102" y="107" text-anchor="middle" font-weight="600" fill="#1f2937">Outlook user</text>
  <text x="102" y="124" text-anchor="middle" font-size="11.5" fill="#4b5563">Op-Co A</text>
  <rect x="208" y="84" width="156" height="52" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="286" y="107" text-anchor="middle" font-weight="600" fill="#1f2937">Exchange Online</text>
  <text x="286" y="124" text-anchor="middle" font-size="11.5" fill="#4b5563">Tenant A</text>
  <rect x="392" y="84" width="156" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="470" y="107" text-anchor="middle" font-weight="600" fill="#1f2937">Federation + EWS</text>
  <text x="470" y="124" text-anchor="middle" font-size="11.5" fill="#4b5563">domain-based trust</text>
  <rect x="576" y="84" width="156" height="52" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="654" y="107" text-anchor="middle" font-weight="600" fill="#1f2937">Exchange Online</text>
  <text x="654" y="124" text-anchor="middle" font-size="11.5" fill="#4b5563">Tenant B</text>
  <g text-anchor="middle" font-size="11.5" fill="#4b5563">
    <text x="286" y="158">Org Relationship /</text>
    <text x="286" y="173">Sharing Policy by domain</text>
    <text x="470" y="158">blocked from Oct 1, 2026</text>
    <text x="470" y="173">gone Apr 1, 2027</text>
    <text x="654" y="158">Org Relationship /</text>
    <text x="654" y="173">Sharing Policy by domain</text>
  </g>

  <line x1="24" y1="206" x2="736" y2="206" stroke="#e5e7eb" stroke-width="1"/>

  <text x="24" y="236" font-weight="600" fill="#4b5563">After: M365 Cross-Tenant Access Policy</text>
  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <path d="M180 280H208" marker-end="url(#arrow)"/>
    <path d="M364 280H392" marker-end="url(#arrow)"/>
    <path d="M548 280H576" marker-end="url(#arrow)"/>
  </g>
  <rect x="24" y="254" width="156" height="52" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="102" y="277" text-anchor="middle" font-weight="600" fill="#1f2937">Outlook user</text>
  <text x="102" y="294" text-anchor="middle" font-size="11.5" fill="#4b5563">Op-Co A</text>
  <rect x="208" y="254" width="156" height="52" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="286" y="277" text-anchor="middle" font-weight="600" fill="#1f2937">Exchange Online</text>
  <text x="286" y="294" text-anchor="middle" font-size="11.5" fill="#4b5563">Tenant A</text>
  <rect x="392" y="254" width="156" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="470" y="277" text-anchor="middle" font-weight="600" fill="#1f2937">Entra-governed path</text>
  <text x="470" y="294" text-anchor="middle" font-size="11.5" fill="#4b5563">tenant-ID-based trust</text>
  <rect x="576" y="254" width="156" height="52" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="654" y="277" text-anchor="middle" font-weight="600" fill="#1f2937">Exchange Online</text>
  <text x="654" y="294" text-anchor="middle" font-size="11.5" fill="#4b5563">Tenant B</text>
  <g text-anchor="middle" font-size="11.5" fill="#4b5563">
    <text x="654" y="328">Inbound XTAP policy</text>
    <text x="654" y="343">for partner Tenant A</text>
  </g>
</svg>
